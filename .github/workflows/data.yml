name: backup
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: write
concurrency: backup
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the shared data into the repo
        run: |
          ID=$(cat data/blob.txt 2>/dev/null | tr -d '[:space:]' || true)
          if [ -z "$ID" ]; then echo "no store yet"; exit 0; fi
          CODE=$(curl -s -o /tmp/b.json -w '%{http_code}' -H 'Accept: application/json' "https://jsonblob.com/api/jsonBlob/$ID" || true)
          if [ "$CODE" = "200" ] && [ -s /tmp/b.json ]; then cp /tmp/b.json data/backup.json; else echo "backup skipped (status $CODE)"; fi
      - name: Save
        run: |
          git config user.name "savta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "גיבוי נתונים" && git push)
